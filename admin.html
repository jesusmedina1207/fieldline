<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrar tienda</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f2f6;color:#1a1a1a}
header{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header a{color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:10px 18px;border:0;border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
.tabs button.on{background:#111;color:#fff}
.box{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
h2{font-size:1.05rem;margin-bottom:12px}
label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px;color:#555}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.b{padding:10px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:600;margin-top:14px}
.ok{background:#111;color:#fff}.sec{background:#e5e7eb}.del{background:#fee2e2;color:#b91c1c;margin-top:0;padding:7px 12px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.item:last-child{border:0}
.th{width:64px;height:64px;border-radius:8px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:#777}
.prev{width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
.nota{font-size:.8rem;color:#777;margin-top:8px}
.aviso{display:none;background:#fff7d6;border:1px solid #f0d56a;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:.9rem}
</style>
</head>
<body>
<header><strong>⚙ Administrar tienda</strong><span><a href="#" onclick="vista();return false" style="font-weight:700">👁 Vista previa ↗</a> &nbsp; <button class="b ok" style="margin:0;background:#ece8da;color:#111" onclick="exportar()">⬇ Descargar datos.json</button></span></header>
<div class="wrap">
  <div id="aviso" class="aviso"></div>
  <div class="tabs" id="tabs">
    <button data-t="slides" class="on">Slider</button>
    <button data-t="productos">Productos</button>
    <button data-t="ajustes">Ajustes</button>
  </div>
  <div id="vista"></div>
</div>
<div id="toast"></div>
<script src="store.js"></script>
<script>
let D = cargar(), tab = 'slides', edit = null, imgTmp = '';
const $ = s => document.querySelector(s);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
function save() {
  guardar(D); toast('Guardado ✓');
  if (vistaWin && !vistaWin.closed) vistaWin.postMessage({ tipo: 'datos', D }, '*');
  const a = $('#aviso'); a.style.display = 'block';
  a.innerHTML = '📌 Cambios guardados solo en este navegador. Para que los vean tus clientes: pulsa <b>⬇ Descargar datos.json</b> (arriba) y súbelo a GitHub.';
}
function nid() { return Date.now(); }
// Vista previa de la tienda con tu borrador (se actualiza sola al guardar)
let vistaWin = null;
function vista() { vistaWin = window.open('index (1).html?preview=1', 'vistaTienda'); }
window.addEventListener('message', e => {
  if (e.data && e.data.tipo === 'pedir' && e.source) e.source.postMessage({ tipo: 'datos', D }, '*');
});

$('#tabs').onclick = e => {
  if (!e.target.dataset.t) return;
  tab = e.target.dataset.t; edit = null; imgTmp = '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  render();
};

// Subir imagen y reducirla para que ocupe poco
function leerImg(input, cb) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 1000, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}
function campoImagen(actual) {
  imgTmp = actual || '';
  return `<label>Imagen (sube un archivo o pega un enlace)</label>
    <input type="file" accept="image/*" onchange="leerImg(this,d=>{imgTmp=d;$('#url').value='';$('#pv').src=d;$('#pv').style.display='block'})">
    <input id="url" placeholder="https://… (opcional)" style="margin-top:6px" value="${actual && !actual.startsWith('data:') ? esc(actual) : ''}"
      oninput="imgTmp=this.value;$('#pv').src=this.value;$('#pv').style.display=this.value?'block':'none'">
    <img id="pv" class="prev" src="${esc(actual)}" style="display:${actual ? 'block' : 'none'}">`;
}

function render() {
  if (tab === 'slides') vistaSlides();
  else if (tab === 'productos') vistaProductos();
  else vistaAjustes();
}

/* ---------- SLIDES ---------- */
function vistaSlides() {
  const s = edit ? D.slides.find(x => x.id === edit) || {} : {};
  $('#vista').innerHTML = `
  <div class="box"><h2>${edit ? 'Editar slide' : 'Nuevo slide'}</h2>
    <label>Título</label><input id="f_titulo" value="${esc(s.titulo)}">
    <label>Subtítulo</label><input id="f_sub" value="${esc(s.subtitulo)}">
    <div class="row"><div><label>Texto del botón (vacío = sin botón)</label><input id="f_boton" value="${esc(s.boton)}"></div>
    <div><label>El botón filtra por</label><select id="f_cat">
      ${['todos', ...Object.keys(CATS)].map(c => `<option value="${c}" ${s.categoria === c ? 'selected' : ''}>${c === 'todos' ? 'Todo' : CATS[c]}</option>`).join('')}
    </select></div></div>
    ${campoImagen(s.imagen)}
    <button class="b ok" onclick="guardarSlide()">${edit ? 'Actualizar' : 'Agregar slide'}</button>
    ${edit ? '<button class="b sec" onclick="edit=null;render()">Cancelar</button>' : ''}
  </div>
  <div class="box"><h2>Slides actuales (${D.slides.length})</h2>
    ${D.slides.map((x, i) => `<div class="item"><div class="th" style='${fondo(x.imagen, i)}'></div>
      <div class="t"><b>${esc(x.titulo)}</b><small>${esc(x.subtitulo)}</small></div>
      <button class="b sec" style="margin:0;padding:7px 10px" onclick="mueve(${i},-1)">↑</button>
      <button class="b sec" style="margin:0;padding:7px 10px" onclick="mueve(${i},1)">↓</button>
      <button class="b sec" style="margin:0;padding:7px 12px" onclick="edit=${x.id};render();scrollTo(0,0)">Editar</button>
      <button class="b del" onclick="borrarSlide(${x.id})">✕</button></div>`).join('') || '<p class="nota">Sin slides.</p>'}
  </div>`;
}
function guardarSlide() {
  const o = { titulo: $('#f_titulo').value.trim(), subtitulo: $('#f_sub').value.trim(), boton: $('#f_boton').value.trim(), categoria: $('#f_cat').value, imagen: imgTmp };
  if (!o.titulo) return toast('Escribe un título');
  if (edit) Object.assign(D.slides.find(x => x.id === edit), o); else D.slides.push({ id: nid(), ...o });
  edit = null; save(); render();
}
function borrarSlide(id) { if (confirm('¿Eliminar este slide?')) { D.slides = D.slides.filter(x => x.id !== id); save(); render(); } }
function mueve(i, d) { const j = i + d; if (j < 0 || j >= D.slides.length) return; [D.slides[i], D.slides[j]] = [D.slides[j], D.slides[i]]; save(); render(); }

/* ---------- PRODUCTOS ---------- */
function vistaProductos() {
  const p = edit ? D.productos.find(x => x.id === edit) || {} : {};
  $('#vista').innerHTML = `
  <div class="box"><h2>${edit ? 'Editar producto' : 'Nuevo producto'}</h2>
    <div class="row"><div><label>Nombre</label><input id="p_nombre" value="${esc(p.nombre)}"></div>
    <div><label>Categoría</label><select id="p_cat">
      ${Object.entries(CATS).map(([k, n]) => `<option value="${k}" ${p.categoria === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    <label>Precio (MXN)</label><input id="p_precio" type="number" min="0" value="${esc(p.precio)}">
    <label>Descripción</label><textarea id="p_desc" rows="2">${esc(p.descripcion)}</textarea>
    ${campoImagen(p.imagen)}
    <button class="b ok" onclick="guardarProd()">${edit ? 'Actualizar' : 'Agregar producto'}</button>
    ${edit ? '<button class="b sec" onclick="edit=null;render()">Cancelar</button>' : ''}
  </div>
  <div class="box"><h2>Subir muchas fotos de golpe</h2>
    <label>Categoría para todas</label>
    <select id="m_cat">${Object.entries(CATS).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select>
    <label>Fotos (puedes elegir varias)</label>
    <input type="file" id="m_files" accept="image/*" multiple onchange="masivo(this)">
    <p class="nota">Se crea un producto por foto con el nombre "Producto nuevo". Después edítalo para ponerle nombre y precio.</p>
  </div>
  <div class="box"><h2>Productos (${D.productos.length})</h2>
    ${D.productos.map((x, i) => `<div class="item"><div class="th" style='${fondo(x.imagen, i)}'></div>
      <div class="t"><b>${esc(x.nombre)}</b><small>${esc(CATS[x.categoria] || '')} · ${Number(x.precio) > 0 ? '$' + esc(x.precio) : 'Consultar precio'}</small></div>
      <button class="b sec" style="margin:0;padding:7px 12px" onclick="edit=${x.id};render();scrollTo(0,0)">Editar</button>
      <button class="b del" onclick="borrarProd(${x.id})">✕</button></div>`).join('') || '<p class="nota">Sin productos.</p>'}
  </div>`;
}
function guardarProd() {
  const o = { nombre: $('#p_nombre').value.trim(), categoria: $('#p_cat').value, precio: Number($('#p_precio').value) || 0, descripcion: $('#p_desc').value.trim(), imagen: imgTmp };
  if (!o.nombre) return toast('Escribe un nombre');
  if (edit) Object.assign(D.productos.find(x => x.id === edit), o); else D.productos.push({ id: nid(), ...o });
  edit = null; save(); render();
}
function borrarProd(id) { if (confirm('¿Eliminar este producto?')) { D.productos = D.productos.filter(x => x.id !== id); save(); render(); } }

/* ---------- AJUSTES ---------- */
function vistaAjustes() {
  const c = D.config;
  $('#vista').innerHTML = `
  <div class="box"><h2>Datos de la tienda</h2>
    <label>Nombre de la marca</label><input id="c_nombre" value="${esc(c.nombre)}">
    <label>Eslogan</label><input id="c_eslogan" value="${esc(c.eslogan)}">
    <label>Instagram (usuario, sin @)</label><input id="c_ig" value="${esc(c.instagram)}">
    <label>Mensaje de la barra superior (vacío = ocultar)</label><input id="c_anuncio" value="${esc(c.anuncio)}">
    <div class="row"><div><label>WhatsApp (con lada país, sin +)</label><input id="c_wa" value="${esc(c.whatsapp)}" placeholder="5214421234567"></div>
    <div><label>Color principal</label><input id="c_color" type="color" value="${esc(c.color)}" style="height:42px"></div></div>
    <button class="b ok" onclick="guardarAjustes()">Guardar</button>
  </div>
  <div class="box"><h2>Respaldo</h2>
    <button class="b ok" style="margin-top:0" onclick="exportar()">⬇ Descargar datos.json</button>
    <button class="b sec" style="margin-top:0" onclick="$('#imp').click()">Cargar un datos.json</button>
    <button class="b sec" style="margin-top:0" onclick="traerPublicado()">Traer lo publicado</button>
    <button class="b del" onclick="if(confirm('¿Restaurar datos de ejemplo?')){localStorage.removeItem(KEY);D=cargar();save();render()}">Restaurar ejemplo</button>
    <input id="imp" type="file" accept=".json" hidden onchange="importar(this)">
    <p class="nota">Tus cambios se guardan como borrador en este navegador. Para publicarlos, descarga datos.json y reemplázalo en GitHub. "Traer lo publicado" descarta tu borrador y carga lo que está en línea.</p>
  </div>`;
}
function guardarAjustes() {
  D.config = { nombre: $('#c_nombre').value.trim() || 'MI MARCA', eslogan: $('#c_eslogan').value.trim(), anuncio: $('#c_anuncio').value.trim(), instagram: $('#c_ig').value.trim().replace('@', ''), whatsapp: $('#c_wa').value.replace(/\D/g, ''), color: $('#c_color').value };
  save();
}
function reducir(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1000 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = im.width * k; c.height = im.height * k;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.75));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function masivo(inp) {
  const cat = $('#m_cat').value, files = [...inp.files];
  if (!files.length) return;
  toast('Procesando ' + files.length + ' fotos…');
  for (let i = 0; i < files.length; i++) {
    D.productos.push({ id: nid() + i, categoria: cat, nombre: 'Producto nuevo', precio: 0, descripcion: '', imagen: await reducir(files[i]) });
  }
  save(); render();
}
async function traerPublicado() {
  try {
    const r = await fetch('datos.json?v=' + Date.now(), { cache: 'no-store' });
    const d = await r.json(); if (!d.config) throw 0;
    D = d; save(); render();
  } catch (e) { toast('No se pudo leer datos.json'); }
}
function exportar() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D)], { type: 'application/json' }));
  a.download = 'datos.json'; a.click();
  toast('Sube este archivo a GitHub para publicar');
}
function importar(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); if (!d.config) throw 0; D = d; save(); render(); } catch (e) { toast('Archivo no válido'); } });
}
cargarAdmin().then(d => { D = d; render(); });
</script>
</body>
</html>
